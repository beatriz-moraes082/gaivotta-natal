  :root{
    --tinta:#191430;
    --tinta-suave:#655E86;
    --cartao:#FFFFFF;
    --fundo:#F4F1EA;
    --borda:#DAD5E2;
    --indigo:#2E1C6F;
    --indigo-txt:#FFF6E9;
    --sol:#F0A02C;
    --dourado:#C99320;
    --tom:#D2342A;
    --tinta-arte:#191430;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --tinta:#EFEBFA;
      --tinta-suave:#A79FC4;
      --cartao:#17142A;

      --indigo:#7E6BE8;
      --indigo-txt:#120C28;
      --sol:#FFB44D;
      --dourado:#E8B84B;
      --tinta-arte:#F3EEE2;
    }
  }
  :root[data-theme="dark"]{
    --tinta:#EFEBFA;
    --tinta-suave:#A79FC4;
    --cartao:#17142A;
    --fundo:#0C0A18;
    --borda:#332C52;
    --indigo:#7E6BE8;
    --indigo-txt:#120C28;
    --sol:#FFB44D;
    --dourado:#E8B84B;
    --tinta-arte:#F3EEE2;
  }

  *{box-sizing:border-box}
  body{
    margin:0;background:var(--fundo);color:var(--tinta);
    font-family:"DM Sans",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .app{
    max-width:460px;margin:0 auto;min-height:100dvh;
    background:var(--cartao);display:flex;flex-direction:column;
    position:relative;overflow:hidden;
  }
  @media (min-width:620px){
    .app{
      min-height:auto;height:min(880px,calc(100dvh - 40px));
      margin:20px auto;border-radius:32px;
      box-shadow:0 30px 70px -24px rgba(25,20,48,.42);
    }
  }

  /* ---------- festão de luzes ---------- */
  header{
    flex:none;display:flex;align-items:center;gap:10px;
    padding:10px 14px 6px;padding-top:max(10px,env(safe-area-inset-top));
    background:var(--cartao);position:relative;z-index:3;
  }
  .voltar{
    width:40px;height:40px;flex:none;border:none;background:transparent;
    color:var(--tinta);border-radius:50%;display:grid;place-items:center;
    cursor:pointer;transition:background .15s,transform .12s;
  }
  .voltar:hover{background:var(--fundo)}
  .voltar:active{transform:scale(.9)}
  .voltar[hidden]{display:none}

  .festao{flex:1;height:38px;position:relative}
  .festao[hidden]{display:none}
  .festao svg{position:absolute;inset:0;width:100%;height:100%}
  .fio{fill:none;stroke:var(--borda);stroke-width:2.5;stroke-linecap:round}
  .luz{
    position:absolute;width:11px;height:11px;margin-left:-5.5px;
    border-radius:50% 50% 56% 56%;background:var(--borda);
    transition:background .35s,box-shadow .35s,transform .35s cubic-bezier(.3,1.6,.5,1);
  }
  .luz::before{
    content:"";position:absolute;top:-4px;left:50%;margin-left:-2.5px;
    width:5px;height:4px;border-radius:1.5px;background:var(--borda);
  }
  .luz.on{transform:scale(1.34)}
  .conta{
    flex:none;font-size:12px;font-weight:700;color:var(--tinta-suave);
    font-variant-numeric:tabular-nums;letter-spacing:.04em;
  }
  .conta[hidden]{display:none}

  /* ---------- banda ilustrada ---------- */
  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;position:relative}
  .banda{
    flex:none;height:214px;position:relative;display:grid;place-items:center;
    margin-bottom:-30px;
  }
  .banda svg{width:172px;height:172px;display:block}

  .folha{
    position:relative;z-index:2;flex:1;background:var(--cartao);
    border-radius:30px 30px 0 0;padding:26px 22px 24px;
    display:flex;flex-direction:column;gap:18px;
  }

  h1{
    font-family:"Bricolage Grotesque","Trebuchet MS",sans-serif;
    font-weight:800;font-size:30px;line-height:1.08;letter-spacing:-.02em;
    margin:0;text-wrap:balance;
  }
  .dica{margin:-9px 0 0;font-size:15px;line-height:1.5;color:var(--tinta-suave)}

  /* ---------- opções ---------- */
  .lista{display:flex;flex-direction:column;gap:10px}
  .op{
    display:flex;align-items:center;gap:12px;width:100%;min-height:58px;
    padding:12px 14px 12px 16px;background:var(--cartao);
    border:2px solid var(--borda);border-radius:16px;
    font:inherit;font-size:16.5px;color:var(--tinta);text-align:left;cursor:pointer;
    transition:border-color .15s,background .2s,transform .12s;
  }
  .op:hover{border-color:var(--tinta-suave)}
  .op:active{transform:scale(.985)}
  .op[aria-pressed="true"]{
    border-color:var(--indigo);
    background:color-mix(in srgb, var(--tom) 15%, var(--cartao));
  }
  .op .txt{flex:1;line-height:1.25;font-weight:500}
  .op .sub{display:block;font-size:13.5px;font-weight:400;color:var(--tinta-suave);margin-top:3px}
  .op[aria-pressed="true"] .sub{color:var(--tinta);opacity:.72}
  .marca{
    width:26px;height:26px;flex:none;border-radius:50%;
    border:2px solid var(--borda);display:grid;place-items:center;
    transition:background .2s,border-color .2s;
  }
  .op[aria-pressed="true"] .marca{background:var(--indigo);border-color:var(--indigo)}
  .marca svg{width:14px;height:14px;opacity:0;stroke:var(--indigo-txt);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:opacity .15s}
  .op[aria-pressed="true"] .marca svg{opacity:1;animation:selo .3s cubic-bezier(.3,1.7,.5,1) both}
  @keyframes selo{from{transform:scale(.4)}to{transform:scale(1)}}

  .grupo{display:flex;flex-direction:column;gap:9px}
  .rotulo{
    font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--tinta-suave);font-weight:700;
  }
  .chips{display:flex;flex-wrap:wrap;gap:9px}
  .chip.ic{display:inline-flex;align-items:center;gap:8px}
  .chip.ic svg{width:17px;height:17px;flex:none;opacity:.8}
  .chip.ic[aria-pressed="true"] svg{opacity:1;color:var(--indigo)}
  .chip{
    padding:12px 16px;min-height:48px;
    border:2px solid var(--borda);border-radius:999px;
    background:var(--cartao);color:var(--tinta);
    font:inherit;font-size:15.5px;font-weight:500;cursor:pointer;
    transition:border-color .15s,background .2s,transform .12s;
  }
  .chip:hover{border-color:var(--tinta-suave)}
  .chip:active{transform:scale(.96)}
  .chip[aria-pressed="true"]{
    border-color:var(--indigo);
    background:color-mix(in srgb, var(--tom) 15%, var(--cartao));
    animation:selo .28s cubic-bezier(.3,1.7,.5,1) both;
  }

  /* ---------- calendário ---------- */
  .cal{background:var(--cartao);border:2px solid var(--borda);border-radius:18px;padding:12px 10px 10px}
  .cal-topo{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px}
  .cal-mes{font-weight:700;font-size:16.5px}
  .cal-nav{
    width:38px;height:38px;border-radius:50%;border:none;background:none;color:var(--tinta);
    display:grid;place-items:center;cursor:pointer;
  }
  .cal-nav svg{width:20px;height:20px}
  .cal-nav:disabled{opacity:.25;cursor:default}
  .cal-grade{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-sem{
    text-align:center;font-size:11.5px;font-weight:700;letter-spacing:.06em;
    color:var(--tinta-suave);padding:4px 0 6px;
  }
  .cal-dia{
    aspect-ratio:1;min-height:38px;border-radius:12px;border:none;
    background:color-mix(in srgb, var(--indigo) 7%, var(--cartao));color:var(--tinta);
    font:inherit;font-size:15.5px;font-weight:600;cursor:pointer;
    transition:background .15s,transform .12s;
  }
  .cal-dia:active{transform:scale(.92)}
  .cal-dia:disabled{background:none;color:var(--tinta-suave);opacity:.45;font-weight:400;cursor:default}
  .cal-dia.lotado{text-decoration:line-through}
  .cal-dia[aria-pressed="true"]{background:var(--indigo);color:var(--indigo-txt)}
  .cal-vazio{aspect-ratio:1}
  .sem-data{
    align-self:flex-start;padding:4px 0;background:none;border:none;
    color:var(--tinta-suave);font:inherit;font-size:15px;font-weight:500;
    text-decoration:underline;cursor:pointer;
  }

  .campo-escolha{position:relative;display:flex}
  .escolha{
    appearance:none;-webkit-appearance:none;
    width:100%;min-height:58px;padding:15px 48px 15px 16px;
    border:2px solid var(--borda);border-radius:16px;
    background:var(--cartao);color:var(--tinta);
    font:inherit;font-size:16.5px;font-weight:500;cursor:pointer;
    transition:border-color .15s;
  }
  .escolha:hover{border-color:var(--tinta-suave)}
  .escolha:focus{outline:none;border-color:var(--indigo)}
  .escolha:invalid{color:var(--tinta-suave);font-weight:400}
  .seta{
    position:absolute;right:16px;top:50%;margin-top:-10px;
    width:20px;height:20px;pointer-events:none;color:var(--tinta-suave);
  }

  .campo{display:flex;flex-direction:column;gap:7px}
  .campo[hidden],.grupo[hidden]{display:none}
  .campo label{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta-suave);font-weight:700}
  input,textarea{
    font:inherit;font-size:16px;color:var(--tinta);background:var(--cartao);
    border:2px solid var(--borda);border-radius:16px;padding:14px 16px;width:100%;

  /* ---------- rodapé ---------- */
  footer{
    flex:none;padding:12px 20px;padding-bottom:max(14px,env(safe-area-inset-bottom));

    width:100%;min-height:56px;border:none;border-radius:16px;

    font-size:18px;font-weight:800;letter-spacing:-.01em;
    cursor:pointer;transition:transform .12s,filter .15s;
  }
  .btn:hover{filter:brightness(1.12)}
  .btn:active{transform:scale(.985)}
  .btn:disabled{background:var(--fundo);color:var(--tinta-suave);cursor:not-allowed;filter:none}
  .pular{
    display:block;width:100%;margin-top:2px;padding:11px;background:none;border:none;
    color:var(--tinta-suave);font:inherit;font-size:15px;font-weight:500;
    text-decoration:underline;cursor:pointer;
  }

  /* ---------- abertura ---------- */
  .capa{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;text-align:center;padding:14px 24px 34px;

    animation:sobe .5s cubic-bezier(.2,.75,.3,1) both;

    font-family:"Bricolage Grotesque","Trebuchet MS",sans-serif;

  .capa .selo{
    font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;
    font-weight:700;color:var(--sol);margin:0;
  }

  /* ---------- crédito da Trilha ---------- */
  .trilha{
    display:inline-flex;align-items:center;gap:8px;align-self:center;
    font-size:12px;color:var(--tinta-suave);text-decoration:none;

  }
  :root[data-theme="dark"] .trilha .claro{display:block}
  :root[data-theme="dark"] .trilha .escuro{display:none}
  .capa{position:relative}
  .capa .trilha{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#FFF6E9;opacity:.75}

  .capa .trilha .escuro{display:none}

  .carregando{
    position:absolute;inset:0;z-index:9;background:#2E1C6F;color:#FFF6E9;

  }
  .orcamento dl{margin:0;padding:10px 16px 4px}
  .orcamento .linha{
    display:flex;justify-content:space-between;align-items:baseline;gap:14px;
    padding:11px 0;border-bottom:1px solid var(--borda);
  }
  .orcamento .linha dt{font-size:15px;line-height:1.3}
  .orcamento .linha dd{
    margin:0;flex:none;font-size:15px;font-weight:500;
    font-variant-numeric:tabular-nums;white-space:nowrap;
  }
  .orcamento .total{border-bottom:none;padding-top:13px}
  .orcamento .total dt{font-weight:700;font-size:16px}
  .orcamento .total dd{
    font-family:"Bricolage Grotesque","Trebuchet MS",sans-serif;
    font-weight:800;font-size:19px;letter-spacing:-.01em;
  }
  .ressalva{
    margin:0;padding:12px 16px;background:var(--fundo);
    font-size:13.5px;line-height:1.45;color:var(--tinta-suave);
  }
  .aviso{
    display:flex;gap:11px;align-items:flex-start;
    background:color-mix(in srgb, var(--sol) 26%, var(--cartao));
    border-radius:16px;padding:14px 16px;font-size:14.5px;line-height:1.45;

  .outro{
    display:flex;align-items:center;gap:10px;width:100%;

    background:var(--cartao);color:var(--tinta);

  .outro:hover{border-color:var(--tinta-suave)}
  .outro:active{transform:scale(.99)}
  .outro svg{flex:none;width:21px;height:21px;color:var(--ok, #2E8055)}

  /* ---------- entradas ---------- */
  .entra .banda svg{animation:pula .5s cubic-bezier(.25,1.5,.45,1) both}
  .entra .folha{animation:sobe .4s cubic-bezier(.2,.75,.3,1) both}
  .entra .folha > *{animation:sobe .42s cubic-bezier(.2,.75,.3,1) both}
  .entra .folha > *:nth-child(1){animation-delay:.04s}

  @keyframes pula{from{opacity:0;transform:scale(.72) translateY(14px)}to{opacity:1;transform:none}}

  @media (prefers-reduced-motion:reduce){

  @media (max-width:359px){

<script>
/* ===================================================================
   Gaivotta · Natal 2026 — quiz de briefing de árvore
   TROCAR ANTES DE PUBLICAR: número de WhatsApp que recebe os briefings.
   Formato: 55 + DDD + número, só dígitos.
   =================================================================== */
const WHATSAPP = "5582993964110";

/* ===================================================================
   AGENDAMENTO REAL (Cal.com conectado ao Google Agenda da loja)
   Enquanto `usuario` estiver vazio, o quiz termina no WhatsApp, como hoje.
   Preencha com o usuário da conta (o que aparece em cal.com/SEU-USUARIO)
   e confira se os apelidos abaixo batem com os tipos de evento criados lá.
   O passo a passo está no README.
   =================================================================== */
const CAL = {
  // desligado em 20/10/2026: o quiz termina sempre no WhatsApp com o resumo
  usuario: "",
  tipos: {
    // visita-tecnica continua existindo no Cal, hoje sem uso nenhum
    materiais:"visita-tecnica",
    pequena:  "montagem-ate-180",    // 1h30   — até 1,80 m
    media:    "montagem-210-240",    // 2h30   — 2,10 m a 2,40 m
    grande:   "montagem-3m"          //   4h   — 3 m ou mais, loja, pé-direito alto
  }
};

/* qual tipo de evento abrir, conforme o serviço e o tamanho escolhidos */
/* abre o link sem depender de pop-up: no celular o Safari bloqueia aba nova
   e o toque não fazia nada, então aí a gente navega na própria aba */
function abrir(url){
  let aba = null;
  try{ aba = window.open(url, "_blank"); }catch(e){ /* bloqueado */ }
  if(!aba || aba.closed || typeof aba.closed === "undefined") window.location.href = url;
}

/* medição: silenciosa se o pixel não carregar (bloqueador, modo anônimo) */
function medir(evento, dados, padrao){
  try{
    if(typeof fbq !== "function") return;
    fbq(padrao ? "track" : "trackCustom", evento, dados || {});
  }catch(e){ /* medir nunca pode quebrar o quiz */ }
}

/* ocupa equipe? só materiais e kit pronto a cliente monta sozinha */
function precisaMontagem(r){
  return ((r || R).servico || "").startsWith("Montagem");
}

function tipoAgenda(){
  // só a montagem ocupa agenda; materiais a cliente escolhe com a Aline no WhatsApp
  if(!CAL.usuario || !precisaMontagem()) return null;
  const t = R.tamanho || "";
  if(t === "3 m ou mais") return CAL.tipos.grande;
  if(t === "2,10 m" || t === "2,40 m") return CAL.tipos.media;
  return CAL.tipos.pequena;
}

function linkAgenda(){
  const tipo = tipoAgenda();
  if(!tipo) return null;
  const q = new URLSearchParams();
  if(R.nome) q.set("name", R.nome);
  // o Cal pede um assunto obrigatório; preenchido aqui pra cliente não ter que escrever
  q.set("title", R.tamanho ? `Montagem de árvore ${R.tamanho}` : "Montagem de árvore de Natal");
  q.set("notes", mensagem());
  return `https://cal.com/${CAL.usuario}/${tipo}?${q}`;
}

   =================================================================== */

/* valor da montagem conforme o tamanho; null quando não há montagem */
function estimativa(){
  const t = R.tamanho;
  if(!PRECOS.ativo || !t || !precisaMontagem()) return null;
  const f = PRECOS.montagem[t];
  if(!f || f[0] == null) return null;
  return {min: f[0], max: f[1]};
}

   O calendário vai de amanhã até a data de `ate` (ano-mês-dia).

const MONTAGEM = {

};

/* ===================================================================
   AGENDA DA ALINE (Google Agenda "Gaivotta Jatiuca")
   Endereço do Apps Script que devolve os dias e horários já ocupados
   (só datas e horários, sem nome nem endereço de cliente).
   Evento de dia inteiro ("MONTAGEM ...", "NÃO POSSO") fecha o dia todo;
   evento com horário fecha o horário que ele encosta.
   Vazio = o calendário mostra todos os horários, como antes.
   O script está em apps-script/agenda.gs.
   =================================================================== */
const AGENDA = { url: "https://script.google.com/macros/s/AKfycby6FIKNcUqwOH10haCgrDdJq_7Xto5PjIdHlsCYQGOfv1-V606z5tD5EzV7GkKwtgE/exec" };

let ocupadosPromessa = null;
function ocupados(){
  if(!AGENDA.url) return Promise.resolve({});
  if(!ocupadosPromessa){
    const ctl = new AbortController();
    const t = setTimeout(()=>ctl.abort(), 6000);
    ocupadosPromessa = fetch(AGENDA.url, {signal: ctl.signal})
      .then(r=>r.json())
      .then(j=>j && j.ocupado ? j.ocupado : {})
      .catch(()=>({}))
      .finally(()=>clearTimeout(t));
  }
  return ocupadosPromessa;
}

/* --- festão --- */
let bulbos = [];
function montaFestao(n){
  bulbos.forEach(b=>b.remove());
  bulbos = [];
  for(let k=0;k<n;k++){
    const t = k/(n-1);
    const y = (1-t)*(1-t)*6 + 2*t*(1-t)*22 + t*t*6;   // acompanha a curva do fio
    const b = el("span","luz");
    b.style.left = (4 + t*92) + "%";
    b.style.top = (y+2) + "px";
    festao.append(b);
    bulbos.push(b);
  }
}
montaFestao(PASSOS.length);

function progresso(){
  if(bulbos.length !== VIS.length) montaFestao(VIS.length);
  bulbos.forEach((b,k)=>{
    const acesa = k < i;
    b.classList.toggle("on", acesa);
    b.style.background = acesa ? LUZES[k % LUZES.length] : "";
    b.style.boxShadow = acesa ? `0 0 10px ${LUZES[k % LUZES.length]}99` : "";

}

        R[p.id] = o.v;

    btn.disabled = !R[p.id];
  }

  if(p.tipo === "chips"){
    R[p.id] = R[p.id] || [];
    const box = el("div","chips");
    p.ops.forEach(o=>{
      const b = el("button","chip",o.v);
      b.type = "button";
      b.setAttribute("aria-pressed", R[p.id].includes(o.v));
      b.onclick = ()=>{
        const sel = R[p.id];
        const at = sel.indexOf(o.v);
        if(at > -1) sel.splice(at,1);
        else{
          if(p.max && sel.length >= p.max) sel.shift();
          sel.push(o.v);
        }
        box.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed", sel.includes(x.textContent)));
        mostraOutro();
        if(navigator.vibrate) navigator.vibrate(8);
      };
      box.append(b);
    });
    f.append(box);

    // opção "Outros": a caixinha só aparece (e só vale) com ela marcada
    const opOutro = p.ops.find(o => o.outro);
    let campo = null, txt = null;
    if(opOutro){
      const c = opOutro.outro;
      campo = el("div","campo");
      const lab = el("label","",c.label); lab.htmlFor = "c_"+c.k;
      txt = el("textarea"); txt.id = "c_"+c.k; txt.placeholder = c.ph; txt.value = R[c.k] || "";
      txt.oninput = ()=>{ R[c.k] = txt.value.trim(); valida(); };
      campo.append(lab, txt);
      f.append(campo);
    }
    const comOutro = ()=> opOutro && R[p.id].includes(opOutro.v);
    const valida = ()=>{
      btn.disabled = R[p.id].length === 0 || (comOutro() && !(R[opOutro.outro.k]||"").trim());
    };
    function mostraOutro(){
      if(campo){
        campo.hidden = !comOutro();
        if(comOutro()){ R[opOutro.outro.k] = txt.value.trim(); if(!txt.value) txt.focus(); }
        else delete R[opOutro.outro.k];
      }
      valida();
    }
    btn.textContent = "Continuar";
    mostraOutro();
  }

  if(p.tipo === "agenda"){
    const val = ()=> btn.disabled = p.grupos.some(g => !(R[g.k]||[]).length);
    p.grupos.forEach(g=>{
      R[g.k] = R[g.k] || [];
      const grupo = el("div","grupo");
      grupo.append(el("span","rotulo",g.rot));

      g.ops.forEach(o=>{
        const b = el("button","chip" + (o.ic ? " ic" : ""));
        b.type = "button";
        b.innerHTML = (o.ic ? icone(o.ic) : "") + `<span>${o.v}</span>`;
        b.setAttribute("aria-pressed", R[g.k].includes(o.v));
        b.onclick = ()=>{
          const sel = R[g.k];
          const at = sel.indexOf(o.v);
          if(at > -1) sel.splice(at,1); else sel.push(o.v);
          box.querySelectorAll(".chip").forEach(x=>
            x.setAttribute("aria-pressed", sel.includes(x.querySelector("span").textContent)));
          val();
          if(navigator.vibrate) navigator.vibrate(8);

        box.append(b);

  if(p.tipo === "calendario"){
    const ISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const hoje = new Date(); hoje.setHours(0,0,0,0);
    const inicio = new Date(hoje); inicio.setDate(inicio.getDate()+1);
    const [ay,am,ad] = MONTAGEM.ate.split("-").map(Number);
    const fim = new Date(ay, am-1, ad);
    const horas = d => (d.getDay()===0 || d.getDay()===6) ? MONTAGEM.fimDeSemana : MONTAGEM.semana;
    const deIso = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
    let OC = {};
    const livres = d => {
      const o = OC[ISO(d)];
      if(o === "dia") return [];
      return horas(d).filter(h => !(o || []).includes(h));
    };

    let mes = R.quandoDia ? deIso(R.quandoDia) : new Date(inicio);

    const cal = el("div","cal");
    const topo = el("div","cal-topo");

    const ant = el("button","cal-nav"); ant.type = "button"; ant.innerHTML = seta("m15 18-6-6 6-6"); ant.setAttribute("aria-label","Mês anterior");

    const grade = el("div","cal-grade");
    cal.append(topo, grade);

    const grupo = el("div","grupo");
    const rot = el("span","rotulo");
    const chips = el("div","chips");
    grupo.append(rot, chips);

    const val = ()=>{
      btn.disabled = !(R.quandoDia && R.quandoHora);
      if(!btn.disabled){
        const t = deIso(R.quandoDia).toLocaleDateString("pt-BR",{weekday:"long", day:"numeric", month:"long"});
        R.quando = `${t.charAt(0).toUpperCase()+t.slice(1)}, às ${R.quandoHora}`;
      }
    };

    const horarios = ()=>{
      chips.innerHTML = "";
      grupo.hidden = !R.quandoDia;
      if(!R.quandoDia) return;
      const d = deIso(R.quandoDia);
      rot.textContent = "Horário em " + d.toLocaleDateString("pt-BR",{weekday:"long", day:"numeric", month:"long"});
      const ops = livres(d);
      if(!ops.includes(R.quandoHora)) R.quandoHora = ops.length === 1 ? ops[0] : null;
      ops.forEach(h=>{
        const b = el("button","chip");
        b.type = "button";
        b.textContent = h;
        b.setAttribute("aria-pressed", R.quandoHora === h);
        b.onclick = ()=>{
          R.quandoHora = h;
          chips.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed", x.textContent === h));
          val();
          if(navigator.vibrate) navigator.vibrate(8);
        };
        chips.append(b);
      });
    };

    const desenha = ()=>{
      const nomeMes = mes.toLocaleDateString("pt-BR",{month:"long", year:"numeric"});
      titulo.textContent = nomeMes.charAt(0).toUpperCase() + nomeMes.slice(1);
      ant.disabled = mes <= new Date(inicio.getFullYear(), inicio.getMonth(), 1);
      prox.disabled = new Date(mes.getFullYear(), mes.getMonth()+1, 1) > fim;
      grade.innerHTML = "";
      ["D","S","T","Q","Q","S","S"].forEach(x=>grade.append(el("span","cal-sem",x)));
      for(let k=0; k<mes.getDay(); k++) grade.append(el("span","cal-vazio"));
      const total = new Date(mes.getFullYear(), mes.getMonth()+1, 0).getDate();
      for(let n=1; n<=total; n++){
        const d = new Date(mes.getFullYear(), mes.getMonth(), n);
        const b = el("button","cal-dia", String(n));
        b.type = "button";
        const foraDoPrazo = d < inicio || d > fim;
        b.disabled = foraDoPrazo || !livres(d).length;
        if(!foraDoPrazo && !livres(d).length) b.classList.add("lotado");
        b.setAttribute("aria-pressed", R.quandoDia === ISO(d));
        b.setAttribute("aria-label", d.toLocaleDateString("pt-BR",{weekday:"long", day:"numeric", month:"long"}));
        b.onclick = ()=>{
          R.quandoDia = ISO(d);
          grade.querySelectorAll(".cal-dia").forEach(x=>x.setAttribute("aria-pressed", x === b));
          horarios(); val();
          if(navigator.vibrate) navigator.vibrate(8);
          grupo.scrollIntoView({behavior:"smooth", block:"nearest"});
        };
        grade.append(b);
      }
    };
    ant.onclick = ()=>{ mes = new Date(mes.getFullYear(), mes.getMonth()-1, 1); desenha(); };
    prox.onclick = ()=>{ mes = new Date(mes.getFullYear(), mes.getMonth()+1, 1); desenha(); };

    const semData = el("button","sem-data","Ainda não tenho uma data");
    semData.type = "button";

    f.append(cal, grupo, semData);
    desenha(); horarios();
    btn.textContent = "Continuar";
    val();

    ocupados().then(m=>{
      OC = m || {};
      if(R.quandoDia && !livres(deIso(R.quandoDia)).length){ delete R.quandoDia; delete R.quandoHora; }

    const vazio = el("option","",p.ph || "Escolha uma opção");
    vazio.value = ""; vazio.disabled = true; vazio.selected = !R[p.id];
    sel.append(vazio);
    p.ops.forEach(o=>{
      const op = el("option","",o);
      op.value = o;
      if(R[p.id] === o) op.selected = true;
      sel.append(op);
    });
    sel.onchange = ()=>{
      R[p.id] = sel.value;
      btn.disabled = false;
      if(navigator.vibrate) navigator.vibrate(8);
      setTimeout(adiante, 300);
    };
    box.append(sel);
    box.insertAdjacentHTML("beforeend", `<svg class="seta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>`);
    f.append(box);
    btn.textContent = "Continuar";
    btn.disabled = !R[p.id];
  }

  if(p.tipo === "campos"){
    const box = el("div","lista");
    p.campos.forEach(c=>{
      const campo = el("div","campo");
      const id = "c_"+c.k;
      const lab = el("label","",c.label); lab.htmlFor = id;
      const inp = c.area ? el("textarea") : el("input");
      inp.id = id; inp.placeholder = c.ph; inp.value = R[c.k] || "";
      if(c.tipo) inp.type = c.tipo;
      if(c.tipo === "tel") inp.inputMode = "tel";
      inp.oninput = ()=>{ R[c.k] = inp.value.trim(); valida(p); };
      campo.append(lab, inp);
      box.append(campo);
    });
    f.append(box);
    btn.textContent = (i === VIS.length-1) ? "Ver minha proposta" : "Continuar";
    valida(p);
  }

  palco.append(banda, f);
  btn.onclick = adiante;
  btnPular.onclick = fechar;
  btnVoltar.onclick = ()=>{ if(i===0){ abertura(); } else { i--; render(); } };
}

function valida(p){
  btn.disabled = p.campos.some(c => c.req && !(R[c.k]||"").trim());
}

function adiante(){
  if(btn.disabled) return;
  atualizaVis();
  if(i < VIS.length-1){ i++; render(); }
  else fechar();
}

/* --- tela de espera --- */
function fechar(){
  rodape.hidden = true;
  festao.hidden = conta.hidden = btnVoltar.hidden = true;
  const c = el("div","carregando");
  c.style.setProperty("--tinta-arte","#FFF6E9");
  c.innerHTML = `<svg viewBox="0 0 140 152" class="balanca">${ART.festa}</svg>`;
  const h = el("h2","","Montando sua árvore…");
  c.append(h);
  const frases = ["Montando sua árvore…","Escolhendo a paleta…","Separando os enfeites…","Conferindo a agenda…"];
  let k = 0;
  const troca = setInterval(()=>{ k++; h.textContent = frases[k % frases.length]; }, 700);
  app.append(c);
  setTimeout(()=>{ clearInterval(troca); c.remove(); resultado(); }, 2600);
}

/* --- resultado --- */
const RESUMO = [
  ["Local","local"],["Serviço","servico"],["Árvore","tem"],["Tamanho","tamanho"],
  ["Enfeites","enfeites"],["Estilo","estilo"],["Como imagina","estiloOutro"],["Região","regiao"],["Dia e horário","quando"]
];

function resultado(){
  palco.scrollTop = 0;
  palco.className = "entra";
  palco.innerHTML = "";
  rodape.hidden = false;
  festao.hidden = conta.hidden = btnVoltar.hidden = true;
  const nome = R.nome ? R.nome.trim().split(" ")[0] : "";
  medir("Lead", {servico: R.servico, tamanho: R.tamanho, regiao: R.regiao}, true);

  const banda = fazBanda("indigo","festa");

  const agenda = linkAgenda();
  const est = estimativa();

  const f = el("div","folha");
  f.append(el("h1","", nome ? `Prontinho, ${nome}!` : "Prontinho!"));
  f.append(el("p","dica", est
    ? "Esse é o valor da montagem. Se estiver bom pra você, é só mandar o resumo pra Aline no WhatsApp: ela confere se o dia que você escolheu está livre."
    : "Agora é só mandar pra Aline. Ela escolhe a árvore e os enfeites com você por mensagem e leva até sua casa só o que você escolher."));

  const fichas = el("div","fichas");
  const JUNTOS = new Set(["dias","horarios"]);   // cabem numa ficha só
  RESUMO.forEach(([rot,k])=>{
    const v = R[k];
    if(!v || (Array.isArray(v) && !v.length)) return;
    const lista = (Array.isArray(v) && !JUNTOS.has(k)) ? v : [Array.isArray(v) ? v.join(", ") : v];
    lista.forEach(item=>{
      const ch = el("span","ficha");
      ch.innerHTML = `<b>${rot}</b>`;
      ch.append(document.createTextNode(item));
      fichas.append(ch);
    });
  });
  f.append(fichas);

  const card = el("div","orcamento");
  card.append(el("h2","", est ? "Sua estimativa" : "Como funciona"));
  if(est){
    const dl = el("dl");
    const l = el("div","linha total");
    l.append(el("dt","","Montagem no local"), el("dd","", est.min === est.max ? reais(est.min) : `${reais(est.min)} a ${reais(est.max)}`));
    dl.append(l);
    card.append(dl);
  }
  card.append(el("p","ressalva", est
    ? "Esse é o valor da mão de obra, fechado pelo tamanho da árvore. Árvore e enfeites a Aline separa junto com você, e no dia da montagem a gente conta só o que for usado."
    : "Você escolhe a árvore e os enfeites com a Aline pelo WhatsApp, sem compromisso. Ela leva até a sua casa só o que você escolher."));
  f.insertBefore(card, fichas);   // o valor vem antes do briefing, não depois

  const av = el("div","aviso");
  av.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l3.5 2"/></svg>`;
  av.append(document.createTextNode("Novembro lota rápido: as agendas de montagem da segunda quinzena costumam fechar primeiro."));
  f.append(av);

  const lojas = el("div","lojas");
  lojas.innerHTML = "<b>Nossas lojas</b>";
  lojas.append(el("span","","Av. Moreira Lima — Centro"), el("span","","Av. Julio Marques Luz, 1149 — Jatiúca"));
  f.append(lojas);
  f.append(creditoTrilha());

  const zap = ()=>{
    medir("Contact", {}, true);
    abrir(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(mensagem())}`);
  };

  if(agenda){
    const outro = el("button","outro");
    outro.type = "button";
    outro.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 20.5l1.5-4.9a8.4 8.4 0 0 1-1-4.1 8.4 8.4 0 0 1 8.4-8.4 8.4 8.4 0 0 1 8.5 8.4Z"/></svg><span>${est ? "Quer conversar sobre o valor antes? Falar no WhatsApp" : "Prefere falar com a gente antes? Chamar no WhatsApp"}</span>`;
    outro.onclick = zap;
    f.insertBefore(outro, av);
  }

  palco.append(banda, f);

  btn.textContent = agenda
    ? (est ? "Está bom, escolher o horário" : "Escolher dia e horário")
    : "Conferir disponibilidade no WhatsApp";
  btn.disabled = false;
  btn.onclick = agenda
    ? ()=>{ medir("Schedule", {tipo: tipoAgenda()}, true); abrir(agenda); }
    : zap;

  btnPular.hidden = false;
  btnPular.textContent = "Refazer o quiz";
  btnPular.onclick = ()=>{ Object.keys(R).forEach(k=>delete R[k]); R.servico = SERVICO; i=0; abertura(); };

  confete();
}

function mensagem(){
  const L = ["Oi, Gaivotta! Fiz o quiz da árvore de Natal 🎄",""];
  if(R.nome) L.push(`Nome: ${R.nome}`);
  RESUMO.forEach(([rot,k])=>{
    const v = R[k];
    if(!v || (Array.isArray(v) && !v.length)) return;
    L.push(`${rot}: ${Array.isArray(v) ? v.join(", ") : v}`);
  });
  if(R.obs) L.push(`Recado: ${R.obs}`);
  if(R.quandoDia) L.push("", "Pode conferir se esse dia e horário estão livres?");
  return L.join("\n");
}

/* --- confete --- */
function confete(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = el("canvas"); cv.id = "confete";
  app.append(cv);
  const ctx = cv.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const L = app.clientWidth, A = app.clientHeight;
  cv.width = L*dpr; cv.height = A*dpr; ctx.scale(dpr,dpr);

  const cores = [C.vermelho, C.dourado, C.sol, C.verde, C.creme];
  const pecas = Array.from({length:70}, (_,n)=>({
    x: L*(0.15 + 0.7*((n*37%100)/100)),
    y: -20 - (n%14)*26,
    l: 6 + (n%5)*2.2,
    a: (n%360)*Math.PI/180,
    va: (n%2?1:-1)*(0.06 + (n%5)*0.015),
    vx: ((n%7)-3)*0.28,
    vy: 1.8 + (n%6)*0.34,
    cor: cores[n % cores.length]
  }));

  let quadros = 0;
  (function anima(){
    ctx.clearRect(0,0,L,A);
    pecas.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.a += p.va; p.vy += 0.016;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a);
      ctx.fillStyle = p.cor;
      ctx.fillRect(-p.l/2, -p.l/3, p.l, p.l*0.66);
      ctx.restore();
    });
    if(++quadros < 230) requestAnimationFrame(anima);
    else cv.remove();
  })();
}

abertura();
</script>
